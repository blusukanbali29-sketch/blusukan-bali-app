<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Blusukan Bali">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" href="./icons/icon-192.png">
<title>PT Blusukan Bali Travel</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f1f5f9;color:#0f172a;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(100%,440px);background:white;border-radius:24px;padding:30px 24px;text-align:center;box-shadow:0 12px 40px #0f172a18}
.logo{width:min(100%,300px);height:auto;max-height:190px;object-fit:contain;margin:0 auto 18px;display:block}
h1{font-size:22px;margin:0 0 8px} p{color:#64748b;line-height:1.5;margin:0 0 22px;font-size:14px}
button{width:100%;border:0;border-radius:14px;background:#0f766e;color:white;padding:15px 18px;font-weight:700;font-size:16px;cursor:pointer}
.note{font-size:12px;margin-top:18px;color:#94a3b8}
</style>
</head>
<body><main><img class="logo" src="./icons/icon-512.png" alt="Logo PT Blusukan Bali Travel"><h1>PT Blusukan Bali Travel</h1><p>Dashboard operasional dan layanan perjalanan Bali.</p><button id="open">Buka Dashboard</button><div class="note">Memerlukan koneksi internet dan akses akun Google yang berwenang.</div></main>
<script>
const DASHBOARD="https://script.google.com/macros/s/AKfycbxMriyrqahx9cJPkBT_x2kcYI3Lv26_UhC17tuYSz8a841xmPwZQBaPprNEB3ynqzz6/exec";
document.getElementById('open').addEventListener('click',()=>{window.location.href=DASHBOARD});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script></body></html>
